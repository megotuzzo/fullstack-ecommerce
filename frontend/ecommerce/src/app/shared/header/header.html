<div class="header-container">
    <header class="header p-3 bg-light shadow-sm">
        <nav class="d-flex justify-content-between align-items-center">
            <div class="input-group" style="max-width: 600px;">
                <input #myInput type="text" type="search" class="form-control rounded" placeholder="Search" aria-label="Search"
                    aria-describedby="search-addon" (keyup.enter)="doSearch(myInput.value)" />
                <button (click)="doSearch(myInput.value)" class="btn btn-outline-primary" data-mdb-ripple-init>Search</button>
            </div>
            <div>
                <p class="mb-0"> Shopping Cart</p>
            </div>
        </nav>
    </header>
</div>
